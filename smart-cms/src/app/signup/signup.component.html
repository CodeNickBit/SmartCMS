<div class="h-screen bg-[#101935] flex flex-col font-sans text-white overflow-hidden">
  <div class="flex-1 overflow-y-auto">
    <div class="container mx-auto px-4 py-6 max-w-6xl">
      <form (ngSubmit)="onSubmit()" #signupForm="ngForm" class="space-y-6">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 lg:gap-10">

          <!-- Left Column: Personal Details -->

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col gap-2">
                  <label for="firstName" class="text-sm font-medium text-gray-300">First Name <span class="text-[#EE964B]">*</span></label>
                  <input type="text" id="firstName" [(ngModel)]="firstName" name="firstName" required (blur)="validateField('firstName')" 
                    autocomplete="given-name" placeholder="Rohit"
                    class="w-full bg-[#1B264F] border border-gray-600 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#3083DC]">
                  <p *ngIf="errors['firstName']" class="text-[#EE964B] text-xs">{{ errors['firstName'] }}</p>
                </div>
                <div class="flex flex-col gap-2">
                  <label for="lastName" class="text-sm font-medium text-gray-300">Last Name <span class="text-[#EE964B]">*</span></label>
                  <input type="text" id="lastName" [(ngModel)]="lastName" name="lastName" required (blur)="validateField('lastName')"
                    autocomplete="family-name" placeholder="Sharma"
                    class="w-full bg-[#1B264F] border border-gray-600 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#3083DC]">
                  <p *ngIf="errors['lastName']" class="text-[#EE964B] text-xs">{{ errors['lastName'] }}</p>
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col gap-2">
                  <label for="email" class="text-sm font-medium text-gray-300">Email Address <span class="text-[#EE964B]">*</span></label>
                  <input type="email" id="email" [(ngModel)]="email" name="email" required (blur)="validateField('email')"
                    autocomplete="email" placeholder="rohit@company.com"
                    class="w-full bg-[#1B264F] border border-gray-600 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#3083DC]">
                  <p *ngIf="errors['email']" class="text-[#EE964B] text-xs">{{ errors['email'] }}</p>
                </div>
                <div class="flex flex-col gap-2">
                  <label for="phone" class="text-sm font-medium text-gray-300">Phone Number</label>
                  <input type="tel" id="phone" [(ngModel)]="phone" name="phone" (input)="onPhoneInput($event)" (blur)="validateField('phone')"
                    autocomplete="tel" placeholder="1234567890" maxlength="10"
                    class="w-full bg-[#1B264F] border border-gray-600 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#3083DC]">
                  <p *ngIf="errors['phone']" class="text-[#EE964B] text-xs">{{ errors['phone'] }}</p>
                </div>
              </div>

              <div class="flex flex-col gap-2">
                <label for="password" class="text-sm font-medium text-gray-300">Password <span class="text-[#EE964B]">*</span></label>
                <div class="relative">
                  <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password" required 
                    (blur)="validateField('password')" autocomplete="new-password" placeholder="Enter a strong password"
                    class="w-full bg-[#1B264F] border border-gray-600 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#3083DC] pr-10">
                  <button type="button" (click)="togglePassword()" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" tabindex="-1"
                    class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white focus:outline-none">
                    <span *ngIf="!showPassword">
                      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                  </button>
                </div>
                <p *ngIf="errors['password']" class="text-[#EE964B] text-xs">{{ errors['password'] }}</p>
              </div>
            </div>
          </div>

            <div class="space-y-4">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="flex flex-col gap-2">
                  <label for="employeeId" class="text-sm font-medium text-gray-300">Employee ID <span class="text-[#EE964B]">*</span></label>
                  <input type="text" id="employeeId" [(ngModel)]="employeeId" name="employeeId" required 
                    (blur)="validateField('employeeId')" autocomplete="off" placeholder="EMP-12345"
                    class="w-full bg-[#1B264F] border border-gray-600 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#3083DC]">
                  <p *ngIf="errors['employeeId']" class="text-[#EE964B] text-xs">{{ errors['employeeId'] }}</p>
                </div>
                <div class="flex flex-col gap-2">
                  <label for="joiningDate" class="text-sm font-medium text-gray-300">Date of Joining</label>
                  <input type="date" id="joiningDate" [(ngModel)]="joiningDate" name="joiningDate"
                    autocomplete="off"
                    class="w-full bg-[#1B264F] border border-gray-600 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#3083DC]">
                </div>
              </div>

              <div class="flex flex-col gap-2">
                <label for="department" class="text-sm font-medium text-gray-300">Department <span class="text-[#EE964B]">*</span></label>
                <select id="department" [(ngModel)]="department" name="department" required (blur)="validateField('department')"
                  class="w-full bg-[#1B264F] border border-gray-600 rounded-lg px-3 py-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-[#3083DC]">
                  <option value="" disabled>Select Department</option>
                  <option value="engineering">Engineering</option>
                  <option value="marketing">Marketing</option>
                  <option value="sales">Sales</option>
              </div>

              <div class="flex flex-col gap-2">
                <label for="designation" class="text-sm font-medium text-gray-300">Designation <span class="text-[#EE964B]">*</span></label>
                <input type="text" id="designation" [(ngModel)]="designation" name="designation" required 
                  (blur)="validateField('designation')" autocomplete="organization-title" placeholder="e.g. Senior Developer"
                  class="w-full bg-[#1B264F] border border-gray-600 rounded-lg px-3 py-2.5 text-sm text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#3083DC]">
                <p *ngIf="errors['designation']" class="text-[#EE964B] text-xs">{{ errors['designation'] }}</p>
              </div>

              <div class="flex flex-col gap-2">
                <fieldset>
                  <legend class="text-sm font-medium text-gray-300 mb-2">Employment Type <span class="text-[#EE964B]">*</span></legend>
                  <div class="flex items-center gap-4 bg-[#1B264F] p-3 rounded-lg border border-gray-600">
                    <label class="flex items-center gap-2 cursor-pointer">
                      <input type="radio" id="employmentType-fulltime" name="employmentType" [(ngModel)]="employmentType" 
                        value="full-time" (change)="validateField('employmentType')" class="form-radio text-[#3083DC]">
                      <span class="text-sm text-gray-300">Full-time</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                      <input type="radio" id="employmentType-contract" name="employmentType" [(ngModel)]="employmentType" 
                        value="contract" (change)="validateField('employmentType')" class="form-radio text-[#3083DC]">
                      <span class="text-sm text-gray-300">Contract</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                      <input type="radio" id="employmentType-intern" name="employmentType" [(ngModel)]="employmentType" 
                        value="intern" (change)="validateField('employmentType')" class="form-radio text-[#3083DC]">
                      <span class="text-sm text-gray-300">Intern</span>
                    </label>
                  </div>
                </fieldset>
                <p *ngIf="errors['employmentType']" class="text-[#EE964B] text-xs">{{ errors['employmentType'] }}</p>
              </div>
            </div>

            <div class="pt-4">
              <p *ngIf="errors['general']" class="text-[#EE964B] text-sm mb-4 text-center">{{ errors['general'] }}</p>
              <button type="submit" [disabled]="isLoading"
                class="w-full bg-[#3083DC] hover:bg-[#206bc4] text-white font-semibold py-3 px-6 rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                <span *ngIf="!isLoading">Create Profile</span>
              <div class="mt-4 text-right">
                <p class="text-gray-400 text-sm">
                  Already have an account?
                  <a routerLink="/login" class="text-[#3083DC] hover:underline font-semibold">Login</a>
                </p>
              </div>
            </div>
      <p class="text-gray-400 text-xs">&copy; 2025 SmartCMS. All rights reserved.</p>
    </div>
  </div>

  <!-- Email Verification Modal -->
  <app-email-verification-modal
    *ngIf="showVerificationModal"
    [email]="email"
    (verified)="onEmailVerified($event)"
    (closed)="onModalClosed()">
  </app-email-verification-modal>
</div>
