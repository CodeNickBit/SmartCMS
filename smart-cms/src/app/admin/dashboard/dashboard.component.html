<div class="flex h-screen bg-[#101935] text-white font-sans overflow-hidden">

  <!-- Sidebar (Matching Add Users) -->
  <aside
    class="w-64 bg-[#1B264F] border-r border-blue-900/30 flex flex-col hidden md:flex shrink-0 transition-all duration-300 relative z-20">
    <div class="flex items-left justify-left mx-5 mt-5 border-b border-blue-900/30 pb-4">
      <div class="flex items-center justify-center">
        <img src="/assets/MEAN_Logo_Dark.png" alt="SmartCMS Logo" class="h-[80px] w-auto object-contain">
      </div>
    </div>

    <nav class="flex-1 overflow-y-auto py-6 px-3 space-y-1">
      <!-- Dashboard - Active -->
      <a href="/admin/dashboard"
        class="group relative flex items-center gap-3 px-3 py-2.5 rounded-lg text-blue-100 bg-white/5 hover:text-white transition-all">
        <svg class="h-5 w-5 text-[#3083DC]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
        </svg>
        <span class="font-medium text-sm">Dashboard</span>
      </a>

      <a href="/admin/add-users"
        class="group relative flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-all">
        <svg class="h-5 w-5 group-hover:text-[#3083DC] transition-colors" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
        <span class="font-medium text-sm">Add Users</span>
      </a>

      <a href="#"
        class="group relative flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-all">
        <svg class="h-5 w-5 group-hover:text-[#3083DC] transition-colors" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <span class="font-medium text-sm">Employees</span>
      </a>

      <a href="#"
        class="group relative flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-all">
        <svg class="h-5 w-5 group-hover:text-[#3083DC] transition-colors" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
        </svg>
        <span class="font-medium text-sm">Departments</span>
      </a>

      <a href="#"
        class="group relative flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-all">
        <svg class="h-5 w-5 group-hover:text-[#3083DC] transition-colors" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <span class="font-medium text-sm">Attendance</span>
      </a>

      <a href="#"
        class="group relative flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-all justify-between">
        <div class="flex items-center gap-3">
          <svg class="h-5 w-5 group-hover:text-[#3083DC] transition-colors" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          <span class="font-medium text-sm">Leave Requests</span>
        </div>
        <span class="bg-[#EE964B]/20 text-[#EE964B] text-xs font-bold px-2 py-0.5 rounded-full">5</span>
      </a>

      <a href="#"
        class="group relative flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-all">
        <svg class="h-5 w-5 group-hover:text-[#3083DC] transition-colors" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
        </svg>
        <span class="font-medium text-sm">Tasks</span>
      </a>

      <a href="#"
        class="group relative flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-all">
        <svg class="h-5 w-5 group-hover:text-[#3083DC] transition-colors" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="font-medium text-sm">Payroll</span>
      </a>

      <a href="#"
        class="group relative flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-all">
        <svg class="h-5 w-5 group-hover:text-[#3083DC] transition-colors" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span class="font-medium text-sm">Reports</span>
      </a>
    </nav>

    <!-- User Profile (Matching Add Users) -->
    <div class="p-4 border-t border-blue-900/30">
      <button
        class="group relative flex items-center w-full gap-3 p-2 rounded-xl hover:bg-white/5 transition-colors text-left">
        <div class="relative">
          <div class="h-10 w-10 rounded-full bg-slate-700 border-2 border-slate-600 overflow-hidden">
            <svg class="h-full w-full text-slate-400" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
          </div>
          <div class="absolute bottom-0 right-0 h-3 w-3 rounded-full bg-green-500 border-2 border-[#1B264F]">
          </div>
        </div>
        <div class="flex-1 overflow-hidden">
          <p class="text-sm font-semibold text-white">{{ adminName }}</p>
          <p class="text-xs text-slate-300 font-medium">{{ adminRole }}</p>
          <p class="text-[10px] text-slate-400 mt-0.5">Login: <span class="text-slate-300">{{ lastLogin
              }}</span></p>
        </div>
        <span
          class="absolute left-4 top-[-40px] px-2 py-1 bg-slate-800 text-white text-xs rounded-md shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50 border border-slate-700">Profile
          Settings</span>
      </button>
      <div class="mt-4 flex items-center justify-between px-2">
        <a href="#" class="group relative text-slate-400 hover:text-white transition-colors">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span
            class="absolute bottom-6 left-1/2 -translate-x-1/2 px-2 py-1 bg-slate-800 text-white text-xs rounded-md shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50 border border-slate-700">Settings</span>
        </a>
        <button (click)="logout()" class="group relative text-slate-400 hover:text-red-400 transition-colors">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span
            class="absolute bottom-6 left-1/2 -translate-x-1/2 px-2 py-1 bg-slate-800 text-white text-xs rounded-md shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50 border border-slate-700">Logout</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col h-full relative">
    <!-- Top Bar (Matching Add Users) -->
    <header class="h-16 bg-[#1B264F] border-b border-blue-900/30 flex items-center justify-between px-6 shrink-0 z-10">
      <div class="flex items-center gap-4">
        <button class="md:hidden p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-700/50">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <h1 class="text-xl font-bold text-white tracking-tight hidden sm:block">Admin Dashboard</h1>
      </div>

      <div class="flex items-center gap-6">
        <div class="relative hidden lg:block group">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-4 w-4 text-slate-400 group-focus-within:text-[#3083DC] transition-colors" fill="none"
              viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </div>
          <input type="text" [(ngModel)]="searchQuery"
            class="bg-[#101935] border border-slate-600 text-slate-300 text-sm rounded-full focus:ring-2 focus:ring-[#3083DC]/50 focus:border-[#3083DC] block w-80 pl-10 p-2.5 placeholder-slate-500 transition-all outline-none"
            placeholder="Search...">
        </div>

        <div class="flex items-center gap-2">
          <button
            class="group relative p-2.5 rounded-full text-slate-400 hover:text-white hover:bg-[#3083DC]/20 transition-all">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.21 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
            <span class="absolute top-2 right-2.5 h-2 w-2 rounded-full bg-red-500 border border-[#1B264F]"></span>
            <span
              class="absolute top-10 right-0 px-2 py-1 bg-slate-800 text-white text-xs rounded-md shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50 border border-slate-700">Notifications</span>
          </button>

          <button
            class="group relative p-2.5 rounded-full text-slate-400 hover:text-white hover:bg-[#3083DC]/20 transition-all">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            <span
              class="absolute top-10 right-0 px-2 py-1 bg-slate-800 text-white text-xs rounded-md shadow-lg opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none whitespace-nowrap z-50 border border-slate-700">Messages</span>
          </button>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto bg-[#101935] p-6 lg:p-8 space-y-8">
      <!-- Existing Dashboard Widgets -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
        <div
          class="bg-[#1B264F] border border-gray-700/50 rounded-xl p-6 hover:border-[#3083DC]/50 transition-all duration-300 animate-fade-in-up"
          style="animation-delay: 0.1s">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 rounded-lg bg-[#3083DC]/20 flex items-center justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#3083DC]" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                </path>
              </svg>
            </div>
          </div>
          <p class="text-2xl font-bold text-white mb-1">12</p>
          <p class="text-sm text-gray-400">Active Projects</p>
        </div>

        <div
          class="bg-[#1B264F] border border-gray-700/50 rounded-xl p-6 hover:border-[#10B981]/50 transition-all duration-300 animate-fade-in-up"
          style="animation-delay: 0.2s">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 rounded-lg bg-[#10B981]/20 flex items-center justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#10B981]" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
          </div>
          <p class="text-2xl font-bold text-white mb-1">48</p>
          <p class="text-sm text-gray-400">Tasks Completed</p>
        </div>

        <div
          class="bg-[#1B264F] border border-gray-700/50 rounded-xl p-6 hover:border-[#8B5CF6]/50 transition-all duration-300 animate-fade-in-up"
          style="animation-delay: 0.3s">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 rounded-lg bg-[#8B5CF6]/20 flex items-center justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#8B5CF6]" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                </path>
              </svg>
            </div>
          </div>
          <p class="text-2xl font-bold text-white mb-1">8</p>
          <p class="text-sm text-gray-400">Team Members</p>
        </div>

        <div
          class="bg-[#1B264F] border border-gray-700/50 rounded-xl p-6 hover:border-[#EE964B]/50 transition-all duration-300 animate-fade-in-up"
          style="animation-delay: 0.4s">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 rounded-lg bg-[#EE964B]/20 flex items-center justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#EE964B]" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
              </svg>
            </div>
          </div>
          <p class="text-2xl font-bold text-white mb-1">5</p>
          <p class="text-sm text-gray-400">Pending Tasks</p>
        </div>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <div class="animate-fade-in-up" style="animation-delay: 0.5s">
          <h2 class="text-xl font-semibold text-white mb-6">Quick Actions</h2>
          <div class="grid grid-cols-2 gap-4">
            <button *ngFor="let action of quickActions"
              class="bg-[#1B264F] border border-gray-700/50 rounded-xl p-5 text-left hover:border-gray-600 transition-all duration-300 group">
              <div class="w-10 h-10 rounded-lg flex items-center justify-center mb-4"
                [style.background-color]="action.color + '20'">
                <svg *ngIf="action.icon === 'users'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                  [style.color]="action.color" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
                  </path>
                </svg>
                <!-- Add User Icon -->
                <svg *ngIf="action.icon === 'user-plus'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                  [style.color]="action.color" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                </svg>
                <svg *ngIf="action.icon === 'folder'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                  [style.color]="action.color" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                </svg>
                <svg *ngIf="action.icon === 'chart'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                  [style.color]="action.color" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z">
                  </path>
                </svg>
                <svg *ngIf="action.icon === 'settings'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5"
                  [style.color]="action.color" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                  </path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
              </div>
              <h3 class="text-white font-medium mb-1 group-hover:text-[#3083DC] transition-colors">{{ action.title }}
              </h3>
              <p class="text-sm text-gray-400">{{ action.description }}</p>
            </button>
          </div>
        </div>

        <div class="animate-fade-in-up" style="animation-delay: 0.6s">
          <h2 class="text-xl font-semibold text-white mb-6">Recent Activity</h2>
          <div class="bg-[#1B264F] border border-gray-700/50 rounded-xl p-6">
            <div class="space-y-5">
              <ng-container *ngFor="let activity of recentActivities; let last = last">
                <div class="flex items-start gap-4"
                  [ngClass]="{'pb-5': !last, 'border-b': !last, 'border-gray-700/50': !last}">
                  <div class="w-2 h-2 rounded-full bg-[#3083DC] mt-2 flex-shrink-0"></div>
                  <div class="flex-1 min-w-0">
                    <p class="text-white text-sm font-medium">{{ activity.action }}</p>
                    <p class="text-gray-400 text-sm truncate">{{ activity.item }}</p>
                  </div>
                  <span class="text-xs text-gray-500 flex-shrink-0">{{ activity.time }}</span>
                </div>
              </ng-container>
            </div>
            <button class="w-full mt-6 py-3 text-sm text-[#3083DC] hover:text-[#4a9df0] font-medium transition-colors">
              View All Activity
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
