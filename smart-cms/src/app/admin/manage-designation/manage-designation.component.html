<div class="flex h-screen bg-[#101935] text-white font-sans overflow-hidden">
  <!-- Sidebar Component -->
  <app-admin-sidebar></app-admin-sidebar>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col h-full relative">
    <!-- Header Component -->
    <app-admin-header title="Manage Designations" [(searchQuery)]="searchQuery"></app-admin-header>

    <div class="flex items-center justify-end px-6 lg:px-8 mt-6">
      <button (click)="openModal()" class="bg-[#3083DC] hover:bg-[#2572c5] text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition-all">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Add Designation
      </button>
    </div>

    <main class="flex-1 overflow-y-auto bg-[#101935] p-6 lg:p-8 space-y-6">
      <!-- Success Message -->
      <div *ngIf="successMessage" class="bg-green-500/20 border border-green-500/50 text-green-400 p-4 rounded-xl flex items-center gap-3">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{successMessage}}
      </div>

      <!-- Designations Table -->
      <div class="bg-[#1B264F] border border-blue-900/30 rounded-xl overflow-hidden shadow-lg">
        <table class="w-full text-left">
          <thead>
            <tr class="text-xs text-slate-400 uppercase border-b border-blue-900/30">
              <th class="px-6 py-4 font-medium">Designation Title</th>
              <th class="px-6 py-4 font-medium">Description</th>
              <th class="px-6 py-4 font-medium">Status</th>
              <th class="px-6 py-4 font-medium">Actions</th>
            </tr>
          </thead>
          <tbody class="text-sm">
            <tr *ngFor="let desig of filteredDesignations" class="border-b border-blue-900/10 hover:bg-white/5 transition-colors">
              <td class="px-6 py-4">
                <span class="font-medium text-white">{{desig.title}}</span>
              </td>
              <td class="px-6 py-4 text-slate-300">{{desig.description || 'No description'}}</td>
              <td class="px-6 py-4">
                <span class="px-2.5 py-1 rounded-full text-xs font-medium border text-green-400 bg-green-500/10 border-green-500/20">
                  Active
                </span>
              </td>
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <button (click)="editDesignation(desig)" class="text-blue-400 hover:text-blue-300 transition-colors" title="Edit Designation">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                  </button>
                  <button (click)="confirmDelete(desig)" class="text-red-400 hover:text-red-300 transition-colors" title="Delete Designation">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                  </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="filteredDesignations.length === 0">
              <td colspan="4" class="px-6 py-12 text-center text-slate-500 italic">No designations found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add Modal -->
  <div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
    <div class="absolute inset-0 bg-[#0A0F1E]/80 backdrop-blur-sm" (click)="closeModal()"></div>
    <div class="bg-[#1B264F] border border-blue-900/50 rounded-2xl w-full max-w-lg shadow-2xl relative z-10 overflow-hidden">
      <div class="px-6 py-4 border-b border-blue-900/30 flex items-center justify-between bg-blue-950/30">
        <h2 class="text-xl font-bold text-white">Add New Designation</h2>
        <button (click)="closeModal()" class="text-slate-400 hover:text-white transition-colors">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="p-6 space-y-4">
        <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-lg text-sm">
          {{errorMessage}}
        </div>
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-slate-300">Designation Title</label>
          <input type="text" [(ngModel)]="newDesignation.title" 
            class="w-full bg-[#101935] border border-blue-900/30 rounded-lg px-4 py-2.5 text-white focus:border-[#3083DC] outline-none transition-all"
            placeholder="e.g. Senior Software Engineer">
        </div>
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-slate-300">Description</label>
          <textarea [(ngModel)]="newDesignation.description" rows="3"
            class="w-full bg-[#101935] border border-blue-900/30 rounded-lg px-4 py-2.5 text-white focus:border-[#3083DC] outline-none transition-all"
            placeholder="Brief description of the designation"></textarea>
        </div>
      </div>
      <div class="px-6 py-4 border-t border-blue-900/30 flex justify-end gap-3 bg-blue-950/10">
        <button (click)="closeModal()" class="px-4 py-2 text-slate-400 font-semibold hover:text-white transition-all">Cancel</button>
        <button (click)="submitDesignation()" class="bg-[#3083DC] hover:bg-[#2572c5] text-white px-6 py-2 rounded-lg font-bold shadow-lg shadow-blue-500/20 transition-all">
          Add Designation
        </button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div *ngIf="showEditModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6">
    <div class="absolute inset-0 bg-[#0A0F1E]/80 backdrop-blur-sm" (click)="closeEditModal()"></div>
    <div class="bg-[#1B264F] border border-blue-900/50 rounded-2xl w-full max-w-lg shadow-2xl relative z-10 overflow-hidden">
      <div class="px-6 py-4 border-b border-blue-900/30 flex items-center justify-between bg-blue-950/30">
        <h2 class="text-xl font-bold text-white">Edit Designation</h2>
        <button (click)="closeEditModal()" class="text-slate-400 hover:text-white transition-colors">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="p-6 space-y-4">
        <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-lg text-sm">
          {{errorMessage}}
        </div>
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-slate-300">Designation Title</label>
          <input type="text" [(ngModel)]="editingDesignation.title" 
            class="w-full bg-[#101935] border border-blue-900/30 rounded-lg px-4 py-2.5 text-white focus:border-[#3083DC] outline-none transition-all"
            placeholder="e.g. Senior Software Engineer">
        </div>
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-slate-300">Description</label>
          <textarea [(ngModel)]="editingDesignation.description" rows="3"
            class="w-full bg-[#101935] border border-blue-900/30 rounded-lg px-4 py-2.5 text-white focus:border-[#3083DC] outline-none transition-all"
            placeholder="Brief description of the designation"></textarea>
        </div>
      </div>
      <div class="px-6 py-4 border-t border-blue-900/30 flex justify-end gap-3 bg-blue-950/10">
        <button (click)="closeEditModal()" class="px-4 py-2 text-slate-400 font-semibold hover:text-white transition-all">Cancel</button>
        <button (click)="updateDesignation()" class="bg-[#3083DC] hover:bg-[#2572c5] text-white px-6 py-2 rounded-lg font-bold shadow-lg shadow-blue-500/20 transition-all">
          Save Changes
        </button>
      </div>
    </div>
  </div>
</div>
