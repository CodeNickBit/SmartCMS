<div class="flex h-screen bg-[#101935] text-white font-sans overflow-hidden">
  <!-- Sidebar Component -->
  <app-admin-sidebar></app-admin-sidebar>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col h-full relative">
    <!-- Header Component -->
    <app-admin-header title="Manage HR" [(searchQuery)]="searchQuery"></app-admin-header>

    <div class="flex items-center justify-end px-6 lg:px-8 mt-6">
      <button (click)="openModal()" class="bg-[#3083DC] hover:bg-[#2572c5] text-white px-4 py-2 rounded-lg font-semibold flex items-center gap-2 transition-all">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Add HR
      </button>
    </div>

    <main class="flex-1 overflow-y-auto bg-[#101935] p-6 lg:p-8 space-y-6">
      <!-- Success Message -->
      <div *ngIf="successMessage" class="bg-green-500/20 border border-green-500/50 text-green-400 p-4 rounded-xl flex items-center gap-3">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        {{successMessage}}
      </div>

      <!-- HR Table -->
      <div class="bg-[#1B264F] border border-blue-900/30 rounded-xl overflow-hidden shadow-lg">
        <table class="w-full text-left">
          <thead>
            <tr class="text-xs text-slate-400 uppercase border-b border-blue-900/30">
              <th class="px-6 py-4 font-medium">Name</th>
              <th class="px-6 py-4 font-medium">Email</th>
              <th class="px-6 py-4 font-medium">Department</th>
              <th class="px-6 py-4 font-medium">Permissions</th>
              <th class="px-6 py-4 font-medium">Actions</th>
            </tr>
          </thead>
          <tbody class="text-sm">
            <tr *ngFor="let hr of filteredHRs" class="border-b border-blue-900/10 hover:bg-white/5 transition-colors">
              <td class="px-6 py-4">
                <span class="font-medium text-white">{{hr.name}}</span>
              </td>
              <td class="px-6 py-4 text-slate-300">{{hr.email}}</td>
              <td class="px-6 py-4 text-slate-300">{{hr.department}}</td>
              <td class="px-6 py-4">
                <div class="flex flex-wrap gap-1">
                  <span *ngIf="hr.permissions?.canRegisterEmployees" class="px-2 py-0.5 rounded-full text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20">Register</span>
                  <span *ngIf="hr.permissions?.canApproveLeaves" class="px-2 py-0.5 rounded-full text-[10px] bg-purple-500/10 text-purple-400 border border-purple-500/20">Leaves</span>
                  <span *ngIf="hr.permissions?.canHandlePayroll" class="px-2 py-0.5 rounded-full text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Payroll</span>
                </div>
              </td>
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <button (click)="editHR(hr)" class="text-blue-400 hover:text-blue-300 transition-colors" title="Edit HR">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                    </svg>
                  </button>
                  <button (click)="confirmDelete(hr)" class="text-red-400 hover:text-red-300 transition-colors" title="Deactivate HR">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                  </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="filteredHRs.length === 0">
              <td colspan="5" class="px-6 py-12 text-center text-slate-500 italic">No HR records found.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Add Modal -->
  <div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
    <div class="absolute inset-0 bg-[#0A0F1E]/80 backdrop-blur-sm" (click)="closeModal()"></div>
    <div class="bg-[#1B264F] border border-blue-900/50 rounded-2xl w-full max-w-lg shadow-2xl relative z-10 overflow-hidden">
      <div class="px-6 py-4 border-b border-blue-900/30 flex items-center justify-between bg-blue-950/30">
        <h2 class="text-xl font-bold text-white">Add New HR</h2>
        <button (click)="closeModal()" class="text-slate-400 hover:text-white transition-colors">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
        <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-lg text-sm">
          {{errorMessage}}
        </div>
        <div class="grid grid-cols-1 gap-4">
          <div class="space-y-1.5">
            <label class="text-sm font-semibold text-slate-300">Full Name</label>
            <input type="text" [(ngModel)]="newHR.name" 
              class="w-full bg-[#101935] border border-blue-900/30 rounded-lg px-4 py-2.5 text-white focus:border-[#3083DC] outline-none transition-all"
              placeholder="e.g. John Doe">
          </div>
          <div class="space-y-1.5">
            <label class="text-sm font-semibold text-slate-300">Email Address</label>
            <input type="email" [(ngModel)]="newHR.email" 
              class="w-full bg-[#101935] border border-blue-900/30 rounded-lg px-4 py-2.5 text-white focus:border-[#3083DC] outline-none transition-all"
              placeholder="hr@example.com">
          </div>
          <div class="space-y-1.5">
            <label class="text-sm font-semibold text-slate-300">Password</label>
            <input type="password" [(ngModel)]="newHR.password" 
              class="w-full bg-[#101935] border border-blue-900/30 rounded-lg px-4 py-2.5 text-white focus:border-[#3083DC] outline-none transition-all"
              placeholder="Min 8 characters">
          </div>
          <div class="space-y-1.5">
            <label class="text-sm font-semibold text-slate-300">Department</label>
            <select [(ngModel)]="newHR.department" 
              class="w-full bg-[#101935] border border-blue-900/30 rounded-lg px-4 py-2.5 text-white focus:border-[#3083DC] outline-none transition-all">
              <option value="" disabled>Select Department</option>
              <option *ngFor="let dept of departments" [value]="dept.name">{{dept.name}}</option>
            </select>
          </div>
          <div class="space-y-3 pt-2">
            <label class="text-sm font-semibold text-slate-300">Permissions</label>
            <div class="grid grid-cols-1 gap-2">
              <label class="flex items-center gap-3 cursor-pointer group">
                <input type="checkbox" [(ngModel)]="newHR.permissions!.canRegisterEmployees" class="w-4 h-4 rounded border-blue-900/30 bg-[#101935] text-[#3083DC] focus:ring-0">
                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Can Register Employees</span>
              </label>
              <label class="flex items-center gap-3 cursor-pointer group">
                <input type="checkbox" [(ngModel)]="newHR.permissions!.canApproveLeaves" class="w-4 h-4 rounded border-blue-900/30 bg-[#101935] text-[#3083DC] focus:ring-0">
                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Can Approve Leaves</span>
              </label>
              <label class="flex items-center gap-3 cursor-pointer group">
                <input type="checkbox" [(ngModel)]="newHR.permissions!.canHandlePayroll" class="w-4 h-4 rounded border-blue-900/30 bg-[#101935] text-[#3083DC] focus:ring-0">
                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Can Handle Payroll</span>
              </label>
            </div>
          </div>
        </div>
      </div>
      <div class="px-6 py-4 border-t border-blue-900/30 flex justify-end gap-3 bg-blue-950/10">
        <button (click)="closeModal()" class="px-4 py-2 text-slate-400 font-semibold hover:text-white transition-all">Cancel</button>
        <button (click)="submitHR()" class="bg-[#3083DC] hover:bg-[#2572c5] text-white px-6 py-2 rounded-lg font-bold shadow-lg shadow-blue-500/20 transition-all">
          Add HR
        </button>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div *ngIf="showEditModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
    <div class="absolute inset-0 bg-[#0A0F1E]/80 backdrop-blur-sm" (click)="closeEditModal()"></div>
    <div class="bg-[#1B264F] border border-blue-900/50 rounded-2xl w-full max-w-lg shadow-2xl relative z-10 overflow-hidden">
      <div class="px-6 py-4 border-b border-blue-900/30 flex items-center justify-between bg-blue-950/30">
        <h2 class="text-xl font-bold text-white">Edit HR</h2>
        <button (click)="closeEditModal()" class="text-slate-400 hover:text-white transition-colors">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
        <div *ngIf="errorMessage" class="bg-red-500/10 border border-red-500/50 text-red-400 p-3 rounded-lg text-sm">
          {{errorMessage}}
        </div>
        <div class="grid grid-cols-1 gap-4" *ngIf="editingHR">
          <div class="space-y-1.5">
            <label class="text-sm font-semibold text-slate-300">Full Name</label>
            <input type="text" [(ngModel)]="editingHR.name" 
              class="w-full bg-[#101935] border border-blue-900/30 rounded-lg px-4 py-2.5 text-white focus:border-[#3083DC] outline-none transition-all">
          </div>
          <div class="space-y-1.5">
            <label class="text-sm font-semibold text-slate-300">Email Address</label>
            <input type="email" [(ngModel)]="editingHR.email" 
              class="w-full bg-[#101935] border border-blue-900/30 rounded-lg px-4 py-2.5 text-white focus:border-[#3083DC] outline-none transition-all">
          </div>
          <div class="space-y-1.5">
            <label class="text-sm font-semibold text-slate-300">Department</label>
            <select [(ngModel)]="editingHR.department" 
              class="w-full bg-[#101935] border border-blue-900/30 rounded-lg px-4 py-2.5 text-white focus:border-[#3083DC] outline-none transition-all">
              <option *ngFor="let dept of departments" [value]="dept.name">{{dept.name}}</option>
            </select>
          </div>
          <div class="space-y-3 pt-2">
            <label class="text-sm font-semibold text-slate-300">Permissions</label>
            <div class="grid grid-cols-1 gap-2">
              <label class="flex items-center gap-3 cursor-pointer group">
                <input type="checkbox" [(ngModel)]="editingHR.permissions.canRegisterEmployees" class="w-4 h-4 rounded border-blue-900/30 bg-[#101935] text-[#3083DC] focus:ring-0">
                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Can Register Employees</span>
              </label>
              <label class="flex items-center gap-3 cursor-pointer group">
                <input type="checkbox" [(ngModel)]="editingHR.permissions.canApproveLeaves" class="w-4 h-4 rounded border-blue-900/30 bg-[#101935] text-[#3083DC] focus:ring-0">
                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Can Approve Leaves</span>
              </label>
              <label class="flex items-center gap-3 cursor-pointer group">
                <input type="checkbox" [(ngModel)]="editingHR.permissions.canHandlePayroll" class="w-4 h-4 rounded border-blue-900/30 bg-[#101935] text-[#3083DC] focus:ring-0">
                <span class="text-sm text-slate-300 group-hover:text-white transition-colors">Can Handle Payroll</span>
              </label>
            </div>
          </div>
        </div>
      </div>
      <div class="px-6 py-4 border-t border-blue-900/30 flex justify-end gap-3 bg-blue-950/10">
        <button (click)="closeEditModal()" class="px-4 py-2 text-slate-400 font-semibold hover:text-white transition-all">Cancel</button>
        <button (click)="updateHR()" class="bg-[#3083DC] hover:bg-[#2572c5] text-white px-6 py-2 rounded-lg font-bold shadow-lg shadow-blue-500/20 transition-all">
          Save Changes
        </button>
      </div>
    </div>
  </div>
</div>
