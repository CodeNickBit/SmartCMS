<!-- Backdrop with blur -->
<div class="fixed inset-0 z-50 flex items-center justify-center backdrop-overlay" 
     (click)="closeModal()">
  <!-- Modal Container -->
  <div class="bg-[#1B264F] rounded-lg shadow-xl max-w-md w-full mx-4 border border-gray-600" 
       (click)="$event.stopPropagation()">
    
    <!-- Modal Header -->
    <div class="flex justify-between items-center p-6 border-b border-gray-600">
      <h2 class="text-xl font-bold text-white">Verify Your Email</h2>
      <button (click)="closeModal()" 
              class="text-gray-400 hover:text-white transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="p-6">
      <!-- Stepper Indicator -->
      <div class="flex items-center justify-center mb-6">
        <div class="flex items-center">
          <!-- Step 1 -->
          <div class="flex flex-col items-center">
            <div [class]="currentStep >= 1 ? 'bg-[#3083DC] text-white' : 'bg-gray-600 text-gray-400'" 
                 class="w-10 h-10 rounded-full flex items-center justify-center font-semibold">
              1
            </div>
            <span class="text-xs mt-2 text-gray-400">Send OTP</span>
          </div>
          <div [class]="currentStep >= 2 ? 'bg-[#3083DC]' : 'bg-gray-600'" 
               class="h-1 w-16 mx-2"></div>
          <!-- Step 2 -->
          <div class="flex flex-col items-center">
            <div [class]="currentStep >= 2 ? 'bg-[#3083DC] text-white' : 'bg-gray-600 text-gray-400'" 
                 class="w-10 h-10 rounded-full flex items-center justify-center font-semibold">
              2
            </div>
            <span class="text-xs mt-2 text-gray-400">Verify OTP</span>
          </div>
        </div>
      </div>

      <!-- Step 1: Send OTP -->
      <div *ngIf="currentStep === 1" class="space-y-4">
        <div class="text-center">
          <p class="text-gray-300 mb-2">We'll send a verification code to:</p>
          <p class="text-[#3083DC] font-semibold">{{ email }}</p>
        </div>
        
        <button (click)="sendOTP()" 
                [disabled]="isSendingEmail"
                class="w-full bg-[#3083DC] hover:bg-[#206bc4] text-white font-semibold py-3 px-6 rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!isSendingEmail">Verify</span>
          <span *ngIf="isSendingEmail">Sending...</span>
        </button>
      </div>

      <!-- Step 2: Enter OTP -->
      <div *ngIf="currentStep === 2" class="space-y-4">
        <div class="text-center">
          <p class="text-gray-300 mb-2">Enter the 6-digit code sent to:</p>
          <p class="text-[#3083DC] font-semibold">{{ email }}</p>
        </div>

        <div class="space-y-2">
          <label class="text-sm font-medium text-gray-300">OTP Code</label>
          <input type="text" 
                 [(ngModel)]="otp" 
                 (input)="onOtpInput($event)"
                 maxlength="6"
                 placeholder="000000"
                 class="w-full bg-[#101935] border border-gray-600 rounded-lg px-4 py-3 text-center text-2xl tracking-widest text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-[#3083DC]">
        </div>

        <button (click)="verifyOTP()" 
                [disabled]="isVerifying || otp.length !== 6"
                class="w-full bg-[#3083DC] hover:bg-[#206bc4] text-white font-semibold py-3 px-6 rounded-lg transition-all disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!isVerifying">Verify OTP</span>
          <span *ngIf="isVerifying">Verifying...</span>
        </button>

        <button (click)="sendOTP()" 
                [disabled]="isSendingEmail"
                class="w-full text-[#3083DC] hover:text-[#4a9df0] font-medium text-sm transition-colors disabled:opacity-50">
          Resend OTP
        </button>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="mt-4 p-3 bg-red-900 bg-opacity-30 border border-red-600 rounded-lg">
        <p class="text-red-400 text-sm">{{ errorMessage }}</p>
      </div>

      <!-- Success Message -->
      <div *ngIf="successMessage" class="mt-4 p-3 bg-green-900 bg-opacity-30 border border-green-600 rounded-lg">
        <p class="text-green-400 text-sm">{{ successMessage }}</p>
      </div>
    </div>
  </div>
</div>
