<div class="min-h-screen bg-[#101935] text-white">
  <!-- Navbar -->
  <nav class="bg-[#1B264F] border-b border-gray-700/50 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <img src="/assets/MEAN_Logo_Dark.png" alt="SmartCMS" class="h-10 w-auto">
          <span class="text-xl font-semibold text-white">SmartCMS</span>
        </div>
        <div class="flex items-center gap-6">
          <button class="text-gray-400 hover:text-white transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
            </svg>
          </button>
          <button (click)="logout()" class="flex items-center gap-2 text-gray-400 hover:text-[#EE964B] transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            <span class="text-sm font-medium">Logout</span>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-6 py-8">
    <!-- Welcome Section -->
    <div class="mb-10 animate-fade-in-up">
      <h1 class="text-3xl font-bold text-white mb-2">Welcome back, {{ userName }}</h1>
      <p class="text-gray-400">{{ currentDate | date:'EEEE, MMMM d, y' }}</p>
    </div>

    <!-- Quick Stats -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
      <div class="bg-[#1B264F] border border-gray-700/50 rounded-xl p-6 hover:border-[#3083DC]/50 transition-all duration-300 animate-fade-in-up" style="animation-delay: 0.1s">
        <div class="flex items-center justify-between mb-4">
          <div class="w-12 h-12 rounded-lg bg-[#3083DC]/20 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#3083DC]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
          </div>
        </div>
        <p class="text-2xl font-bold text-white mb-1">12</p>
        <p class="text-sm text-gray-400">Active Projects</p>
      </div>

      <div class="bg-[#1B264F] border border-gray-700/50 rounded-xl p-6 hover:border-[#10B981]/50 transition-all duration-300 animate-fade-in-up" style="animation-delay: 0.2s">
        <div class="flex items-center justify-between mb-4">
          <div class="w-12 h-12 rounded-lg bg-[#10B981]/20 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#10B981]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
        </div>
        <p class="text-2xl font-bold text-white mb-1">48</p>
        <p class="text-sm text-gray-400">Tasks Completed</p>
      </div>

      <div class="bg-[#1B264F] border border-gray-700/50 rounded-xl p-6 hover:border-[#8B5CF6]/50 transition-all duration-300 animate-fade-in-up" style="animation-delay: 0.3s">
        <div class="flex items-center justify-between mb-4">
          <div class="w-12 h-12 rounded-lg bg-[#8B5CF6]/20 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#8B5CF6]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
          </div>
        </div>
        <p class="text-2xl font-bold text-white mb-1">8</p>
        <p class="text-sm text-gray-400">Team Members</p>
      </div>

      <div class="bg-[#1B264F] border border-gray-700/50 rounded-xl p-6 hover:border-[#EE964B]/50 transition-all duration-300 animate-fade-in-up" style="animation-delay: 0.4s">
        <div class="flex items-center justify-between mb-4">
          <div class="w-12 h-12 rounded-lg bg-[#EE964B]/20 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-[#EE964B]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </div>
        </div>
        <p class="text-2xl font-bold text-white mb-1">5</p>
        <p class="text-sm text-gray-400">Pending Tasks</p>
      </div>
    </div>

    <!-- Quick Actions & Recent Activity -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Quick Actions -->
      <div class="animate-fade-in-up" style="animation-delay: 0.5s">
        <h2 class="text-xl font-semibold text-white mb-6">Quick Actions</h2>
        <div class="grid grid-cols-2 gap-4">
          <button *ngFor="let action of quickActions" 
            class="bg-[#1B264F] border border-gray-700/50 rounded-xl p-5 text-left hover:border-gray-600 transition-all duration-300 group">
            <div class="w-10 h-10 rounded-lg flex items-center justify-center mb-4" [style.background]="action.color + '20'">
              <svg *ngIf="action.icon === 'users'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" [style.color]="action.color" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
              </svg>
              <svg *ngIf="action.icon === 'folder'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" [style.color]="action.color" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
              </svg>
              <svg *ngIf="action.icon === 'chart'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" [style.color]="action.color" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
              </svg>
              <svg *ngIf="action.icon === 'settings'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" [style.color]="action.color" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924-1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </div>
            <h3 class="text-white font-medium mb-1 group-hover:text-[#3083DC] transition-colors">{{ action.title }}</h3>
            <p class="text-sm text-gray-400">{{ action.description }}</p>
          </button>
        </div>
      </div>

      <!-- Recent Activity -->
      <div class="animate-fade-in-up" style="animation-delay: 0.6s">
        <h2 class="text-xl font-semibold text-white mb-6">Recent Activity</h2>
        <div class="bg-[#1B264F] border border-gray-700/50 rounded-xl p-6">
          <div class="space-y-5">
            <div *ngFor="let activity of recentActivities; let last = last" 
              class="flex items-start gap-4" [class.pb-5]="!last" [class.border-b]="!last" [class.border-gray-700/50]="!last">
              <div class="w-2 h-2 rounded-full bg-[#3083DC] mt-2 flex-shrink-0"></div>
              <div class="flex-1 min-w-0">
                <p class="text-white text-sm font-medium">{{ activity.action }}</p>
                <p class="text-gray-400 text-sm truncate">{{ activity.item }}</p>
              </div>
              <span class="text-xs text-gray-500 flex-shrink-0">{{ activity.time }}</span>
            </div>
          </div>
          <button class="w-full mt-6 py-3 text-sm text-[#3083DC] hover:text-[#4a9df0] font-medium transition-colors">
            View All Activity
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="mt-16 border-t border-gray-700/50 py-6">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <p class="text-gray-500 text-sm">&copy; 2025 SmartCMS. All rights reserved.</p>
    </div>
  </footer>
</div>
